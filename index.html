<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 滝学園体育祭サイト</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        /* 上部メニュー */
        .nav { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            padding: 15px; 
            background: #1a365d; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .nav button { 
            padding: 10px 15px; 
            border: none; 
            border-radius: 5px; 
            background: white; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .page { display: none; } 
        .active { display: block; } 
        
        /* テーブルの基本デザイン */
        h2 { border-left: 5px solid #1a365d; padding-left: 10px; font-size: 1.2rem; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px 5px; text-align: center; font-size: 14px; }
        
        /* デフォルトのヘッダー色（種目名など、色指定がないセル用） */
        th.default-bg { background: #edf2f7; color: #4a5568; }
        
        /* PDFリンクボタン */
        .pdf-button { 
            display: block; 
            text-align: center; 
            background: #d93025; 
            color: white; 
            padding: 20px; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="nav">
    <button onclick="showPage('scores')">得点速報</button>
    <button onclick="showPage('schedule')">予定表</button>
    <button onclick="showPage('players')">選手一覧</button>
</div>

<div class="container">
    <div id="page-scores" class="page active">
        <h1>得点速報</h1>
        <div id="score-content">データを読み込み中...</div>
    </div>

    <div id="page-schedule" class="page">
        <h1>タイムスケジュール</h1>
        <div id="schedule-content">データを読み込み中...</div>
    </div>

    <div id="page-players" class="page">
        <h1>出場選手一覧</h1>
        <p>名簿は以下のPDFファイルでご確認いただけます。</p>
        <a href="★ここにPDFのリンクを貼る★" target="_blank" class="pdf-button">
            PDFで選手一覧を開く
        </a>
    </div>
</div>

<script>
    const GAS_URL = '★あなたのGASのURL★';

    // クラス名・軍団名に応じた背景色と文字色を決定する関数
    function getHeaderStyle(cellText) {
        const text = String(cellText).trim();
        
        // クラスの色設定
        if (text === 'A') return { bg: '#fef08a', color: '#000' }; // 黄色
        if (text === 'B') return { bg: '#fbcfe8', color: '#000' }; // ピンク
        if (text === 'C') return { bg: '#e9d5ff', color: '#000' }; // 紫
        if (text === 'D') return { bg: '#fed7aa', color: '#000' }; // オレンジ
        if (text === 'E') return { bg: '#bbf7d0', color: '#000' }; // 緑
        if (text === 'F') return { bg: '#bfdbfe', color: '#000' }; // 青
        if (text === 'G') return { bg: '#fca5a5', color: '#000' }; // 赤
        if (text === 'H') return { bg: '#cffafe', color: '#000' }; // 水色
        if (text === 'I') return { bg: '#1e293b', color: '#fff' }; // 黒（文字は白）

        // 軍団の色設定（部分一致でも反応するように inclusions で判定）
        if (text.includes('赤組') || text.includes('ADG')) return { bg: '#ef4444', color: '#fff' };
        if (text.includes('青組') || text.includes('BEH')) return { bg: '#3b82f6', color: '#fff' };
        if (text.includes('黄色組') || text.includes('CFI')) return { bg: '#eab308', color: '#000' };

        // 該当しない場合はデフォルト色
        return null;
    }

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
    }

    // 表を作る命令（色分け対応版）
    function createTable(dataArray) {
        if (!dataArray || dataArray.length === 0) return "<p>データがありません</p>";
        let html = '<div style="overflow-x:auto;"><table>';
        
        dataArray.forEach((row, idx) => {
            html += "<tr>";
            row.forEach(cell => {
                let displayValue = cell;
                
                // 時刻データのバグ対策
                if (cell instanceof Date || (typeof cell === 'string' && cell.includes('T') && cell.includes('Z'))) {
                    const d = new Date(cell);
                    const hours = d.getHours().toString().padStart(2, '0');
                    const minutes = d.getMinutes().toString().padStart(2, '0');
                    displayValue = `${hours}:${minutes}`;
                }

                // 1行目のヘッダー処理
                if (idx === 0) {
                    const customStyle = getHeaderStyle(displayValue);
                    if (customStyle) {
                        // 指定された色を背景と文字に適用
                        html += `<th style="background: ${customStyle.bg}; color: ${customStyle.color};">${displayValue || ''}</th>`;
                    } else {
                        html += `<th class="default-bg">${displayValue || ''}</th>`;
                    }
                } else {
                    html += `<td>${displayValue === undefined ? '' : displayValue}</td>`;
                }
            });
            html += "</tr>";
        });
        html += "</table></div>";
        return html;
    }

    async function loadData() {
        try {
            const response = await fetch(GAS_URL);
            const allData = await response.json();
            
            let scoreHtml = "";
            let scheduleHtml = "";

            for (let sheetName in allData) {
                if (sheetName.includes("予定表")) {
                    scheduleHtml += createTable(allData[sheetName]);
                } else {
                    scoreHtml += `<h2>${sheetName}</h2>` + createTable(allData[sheetName]);
                }
            }

            document.getElementById('score-content').innerHTML = scoreHtml;
            document.getElementById('schedule-content').innerHTML = scheduleHtml || "<p>予定表シートが見つかりません</p>";

        } catch (e) {
            document.getElementById('score-content').innerHTML = "データの取得に失敗しました。";
            document.getElementById('schedule-content').innerHTML = "データの取得に失敗しました。";
        }
    }

    loadData();
    setInterval(loadData, 120000);
</script>

</body>
</html>
